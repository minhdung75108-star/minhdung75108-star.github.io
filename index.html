<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đếm Ngược Học Tập</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      min-height:100vh;
      padding:25px;
    }

    .container{
      max-width:1300px;
      margin:auto;
    }

    /* TOP */

    .top{
      background: rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:30px;
      padding:50px;
      text-align:center;
      margin-bottom:30px;
      backdrop-filter: blur(10px);
    }

    .main-title{
      font-size:65px;
      font-weight:bold;
      margin-bottom:20px;
    }

    .countdown{
      font-size:90px;
      font-weight:bold;
      color:#38bdf8;
      margin:35px 0;
      line-height:1.3;
      word-break: break-word;
    }

    .target-box{
      margin-top:20px;
    }

    input[type="datetime-local"]{
      padding:15px;
      border:none;
      border-radius:15px;
      font-size:18px;
      width:320px;
      outline:none;
    }

    button{
      padding:15px 25px;
      border:none;
      border-radius:15px;
      background:#38bdf8;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
      margin-left:10px;
    }

    button:hover{
      background:#0ea5e9;
      transform:scale(1.05);
    }

    /* BODY */

    .main{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:25px;
    }

    .box{
      background: rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:25px;
      padding:30px;
      backdrop-filter: blur(10px);
    }

    h2{
      font-size:32px;
      margin-bottom:25px;
      color:#38bdf8;
    }

    /* TIMER */

    .timer-option{
      background:#1e293b;
      padding:20px;
      border-radius:18px;
      margin-bottom:18px;
      cursor:pointer;
      transition:0.3s;
      font-size:20px;
    }

    .timer-option:hover{
      background:#334155;
      transform:translateY(-3px);
    }

    .study-timer{
      font-size:75px;
      text-align:center;
      margin:35px 0;
      font-weight:bold;
      color:#facc15;
    }

    .controls{
      text-align:center;
    }

    /* MUSIC */

    .search{
      width:100%;
      padding:16px;
      border:none;
      border-radius:15px;
      outline:none;
      font-size:16px;
      margin-bottom:20px;
    }

    iframe{
      width:100%;
      height:350px;
      border:none;
      border-radius:20px;
      margin-top:20px;
    }

    .footer{
      margin-top:35px;
      text-align:center;
      color:#94a3b8;
      font-size:18px;
    }

    @media(max-width:900px){

      .main{
        grid-template-columns:1fr;
      }

      .countdown{
        font-size:50px;
      }

      .main-title{
        font-size:40px;
      }

      .study-timer{
        font-size:55px;
      }

      input[type="datetime-local"]{
        width:100%;
        margin-bottom:15px;
      }

      button{
        margin-top:10px;
      }

    }

  </style>

</head>
<body>

<div class="container">

  <!-- TOP -->

  <div class="top">

    <div class="main-title">
      ⏳ Đếm Ngược Mục Tiêu
    </div>

    <div class="countdown" id="countdown">
      00 ngày 00 giờ 00 phút 00 giây
    </div>

    <div class="target-box">

      <input type="datetime-local" id="targetDate">

      <button onclick="setCountdown()">
        Đặt Thời Gian
      </button>

    </div>

  </div>

  <!-- BODY -->

  <div class="main">

    <!-- LEFT -->

    <div class="box">

      <h2>📚 Đồng Hồ Học Tập</h2>

      <div class="timer-option" onclick="setStudyTime(25)">
        ⏰ 25 phút học - 5 phút nghỉ
      </div>

      <div class="timer-option" onclick="setStudyTime(45)">
        ⏰ 45 phút học - 10 phút nghỉ
      </div>

      <div class="timer-option" onclick="setStudyTime(60)">
        ⏰ 60 phút học - 15 phút nghỉ
      </div>

      <div class="study-timer" id="studyTimer">
        25:00
      </div>

      <div class="controls">

        <button onclick="startStudyTimer()">
          Bắt đầu
        </button>

        <button onclick="pauseStudyTimer()">
          Tạm dừng
        </button>

        <button onclick="resetStudyTimer()">
          Đặt lại
        </button>

      </div>

    </div>

    <!-- RIGHT -->

    <div class="box">

      <h2>🎵 Nghe Nhạc Tập Trung</h2>

      <input
        type="text"
        class="search"
        id="youtubeLink"
        placeholder="Dán link YouTube vào đây..."
      >

      <button onclick="loadVideo()">
        Phát Nhạc
      </button>

      <iframe
        id="youtubePlayer"
        src="https://www.youtube.com/embed/jfKfPfyJRdk"
        allowfullscreen>
      </iframe>

    </div>

  </div>

  <div class="footer">
    Thiết kế dành cho học tập ✨
  </div>

</div>

<script>

  /* =========================
     ĐẾM NGƯỢC NGÀY
  ========================== */

  let countdownInterval;

  function setCountdown(){

    clearInterval(countdownInterval);

    const target =
    document.getElementById("targetDate").value;

    const targetDate =
    new Date(target).getTime();

    countdownInterval = setInterval(() => {

      const now = new Date().getTime();

      const distance = targetDate - now;

      if(distance < 0){

        document.getElementById("countdown").innerHTML =
        "🎉 Đã hết thời gian!";

        clearInterval(countdownInterval);

        return;
      }

      const days =
      Math.floor(distance / (1000 * 60 * 60 * 24));

      const hours =
      Math.floor(
      (distance % (1000 * 60 * 60 * 24))
      / (1000 * 60 * 60));

      const minutes =
      Math.floor(
      (distance % (1000 * 60 * 60))
      / (1000 * 60));

      const seconds =
      Math.floor(
      (distance % (1000 * 60))
      / 1000);

      document.getElementById("countdown").innerHTML =
      `${days} ngày ${hours} giờ ${minutes} phút ${seconds} giây`;

    },1000);

  }

  /* =========================
     TIMER HỌC TẬP
  ========================== */

  let studySeconds = 25 * 60;

  let studyTimer;

  let running = false;

  function updateStudyDisplay(){

    let minutes =
    Math.floor(studySeconds / 60);

    let seconds =
    studySeconds % 60;

    document.getElementById("studyTimer").innerHTML =
    String(minutes).padStart(2,'0') + ":" +
    String(seconds).padStart(2,'0');

  }

  function setStudyTime(minutes){

    pauseStudyTimer();

    studySeconds = minutes * 60;

    updateStudyDisplay();

  }

  function startStudyTimer(){

    if(running) return;

    running = true;

    studyTimer = setInterval(() => {

      if(studySeconds > 0){

        studySeconds--;

        updateStudyDisplay();

      }else{

        clearInterval(studyTimer);

        running = false;

        alert("🎉 Hoàn thành phiên học!");

      }

    },1000);

  }

  function pauseStudyTimer(){

    clearInterval(studyTimer);

    running = false;

  }

  function resetStudyTimer(){

    pauseStudyTimer();

    studySeconds = 25 * 60;

    updateStudyDisplay();

  }

  updateStudyDisplay();

  /* =========================
     YOUTUBE PLAYER
  ========================== */

  function loadVideo(){

    const link =
    document.getElementById("youtubeLink").value;

    let videoId = "";

    if(link.includes("watch?v=")){

      videoId =
      link.split("watch?v=")[1].split("&")[0];

    }
    else if(link.includes("youtu.be/")){

      videoId =
      link.split("youtu.be/")[1];

    }

    if(videoId){

      document.getElementById("youtubePlayer").src =
      "https://www.youtube.com/embed/" + videoId;

    }
    else{

      alert("Link YouTube không hợp lệ!");

    }

  }

</script>

</body>
</html>
