<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MDungx Timer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    :root{

      --bg:#0f172a;
      --card:#1e293b;
      --text:#ffffff;
      --sub:#94a3b8;

      --main:
      linear-gradient(135deg,#38bdf8,#8b5cf6);

      --shadow:
      0 10px 30px rgba(0,0,0,0.4);

    }

    body.light{

      --bg:#f3f4ff;
      --card:#ffffff;
      --text:#1e1e1e;
      --sub:#7c83a3;

      --main:
      linear-gradient(135deg,#6d5dfc,#c183ff);

      --shadow:
      0 10px 30px rgba(0,0,0,0.08);

    }

    body{
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      padding:35px;
      transition:0.4s;
    }

    .container{
      max-width:1450px;
      margin:auto;
    }

    /* HEADER */

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:30px;
      flex-wrap:wrap;
      gap:20px;
    }

    .logo-area{
      display:flex;
      align-items:center;
      gap:20px;
    }

    .logo{
      width:80px;
      height:80px;
      border-radius:25px;
      background:var(--main);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:36px;
      color:white;
      box-shadow:var(--shadow);
    }

    .title h1{
      font-size:48px;
      font-weight:700;
    }

    .title p{
      color:var(--sub);
      margin-top:5px;
      font-size:20px;
    }

    .theme-btn{
      width:70px;
      height:70px;
      border-radius:50%;
      border:none;
      background:var(--card);
      color:var(--text);
      font-size:28px;
      cursor:pointer;
      box-shadow:var(--shadow);
      transition:0.3s;
    }

    .theme-btn:hover{
      transform:scale(1.08);
    }

    /* COUNTDOWN */

    .countdown-box{

      background:var(--card);
      border-radius:35px;
      padding:45px;
      margin-bottom:30px;
      box-shadow:var(--shadow);
      text-align:center;

    }

    .quote{
      font-size:23px;
      color:var(--sub);
      margin-bottom:25px;
      min-height:60px;
      line-height:1.6;
    }

    .countdown{
      font-size:75px;
      font-weight:700;
      background:var(--main);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:30px;
    }

    .date-box{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    input{
      padding:18px;
      border:none;
      border-radius:18px;
      background:#334155;
      color:white;
      font-size:16px;
      outline:none;
      width:320px;
    }

    body.light input{
      background:#ececff;
      color:#111;
    }

    button{
      border:none;
      cursor:pointer;
      transition:0.3s;
    }

    .main-btn{
      padding:18px 28px;
      border-radius:18px;
      background:var(--main);
      color:white;
      font-size:16px;
      font-weight:600;
    }

    .main-btn:hover{
      transform:translateY(-3px);
    }

    /* BODY */

    .main{
      display:grid;
      grid-template-columns:1.3fr 1fr;
      gap:30px;
    }

    .card{

      background:var(--card);
      border-radius:35px;
      padding:35px;
      box-shadow:var(--shadow);

    }

    .top-line{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
      flex-wrap:wrap;
      gap:10px;
    }

    .top-line h2{
      font-size:38px;
    }

    .top-line span{
      color:var(--sub);
      font-size:17px;
    }

    /* TIMER */

    .study-time{
      text-align:center;
      font-size:120px;
      font-weight:700;
      background:var(--main);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin:25px 0;
    }

    .progress{
      width:100%;
      height:18px;
      border-radius:20px;
      background:#334155;
      overflow:hidden;
      margin-bottom:35px;
    }

    body.light .progress{
      background:#e5e7eb;
    }

    .progress-bar{
      width:100%;
      height:100%;
      background:var(--main);
      transition:1s linear;
    }

    .controls{
      display:flex;
      gap:15px;
      flex-wrap:wrap;
      justify-content:center;
      margin-bottom:25px;
    }

    .control-btn{

      padding:16px 26px;
      border-radius:18px;
      background:#334155;
      font-size:17px;
      font-weight:600;
      color:white;

    }

    body.light .control-btn{
      background:#ececff;
      color:#333;
    }

    .active-btn{
      background:var(--main);
      color:white;
    }

    .modes{
      display:flex;
      gap:15px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .mode{

      padding:14px 22px;
      border-radius:18px;
      background:#334155;
      cursor:pointer;
      transition:0.3s;
      font-size:18px;

    }

    body.light .mode{
      background:#f1f5f9;
      color:#111;
    }

    .mode:hover{
      transform:translateY(-2px);
    }

    /* MUSIC */

    .music-title{
      font-size:38px;
      margin-bottom:10px;
    }

    .music-sub{
      color:#38bdf8;
      font-weight:600;
      margin-bottom:20px;
      font-size:20px;
    }

    .music-box{
      display:flex;
      gap:15px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    .music-box input{
      flex:1;
      min-width:200px;
    }

    iframe{
      width:100%;
      height:350px;
      border:none;
      border-radius:25px;
      margin-top:10px;
    }

    .footer{
      text-align:center;
      margin-top:30px;
      color:var(--sub);
      font-size:18px;
    }

    @media(max-width:1000px){

      .main{
        grid-template-columns:1fr;
      }

      .study-time{
        font-size:70px;
      }

      .countdown{
        font-size:45px;
      }

      .title h1{
        font-size:35px;
      }

      .logo{
        width:65px;
        height:65px;
      }

      .quote{
        font-size:18px;
      }

    }

  </style>
</head>
<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div class="logo-area">

      <div class="logo">
        ⏰
      </div>

      <div class="title">

        <h1>MDungx Timer</h1>

        <p>
          Học tập hiệu quả — tập trung tối đa.
        </p>

      </div>

    </div>

    <button class="theme-btn" onclick="toggleTheme()">
      🌙
    </button>

  </div>

  <!-- COUNTDOWN -->

  <div class="countdown-box">

    <div class="quote" id="quote">
      “Trí tưởng tượng quan trọng hơn kiến thức.” — Albert Einstein
    </div>

    <div class="countdown" id="countdown">
      00 ngày 00 giờ 00 phút 00 giây
    </div>

    <div class="date-box">

      <input type="datetime-local" id="targetDate">

      <button class="main-btn" onclick="setCountdown()">
        Đặt thời gian
      </button>

    </div>

  </div>

  <!-- MAIN -->

  <div class="main">

    <!-- TIMER -->

    <div class="card">

      <div class="top-line">

        <h2>✔ Làm việc</h2>

        <span>
          Mini timer hoạt động riêng
        </span>

      </div>

      <div class="study-time" id="studyTimer">
        25:00
      </div>

      <div class="progress">

        <div class="progress-bar" id="progressBar"></div>

      </div>

      <div class="controls">

        <button
        class="control-btn active-btn"
        onclick="startStudyTimer()">
          ▶ Bắt đầu
        </button>

        <button
        class="control-btn"
        onclick="pauseStudyTimer()">
          ⏸ Tạm dừng
        </button>

        <button
        class="control-btn"
        onclick="resetStudyTimer()">
          ↻ Reset
        </button>

        <button
        class="control-btn"
        onclick="toggleSound()">
          🔔 Chuông
        </button>

        <button
        class="control-btn"
        onclick="openMiniTimer()">
          🗔 Mini Timer
        </button>

      </div>

      <div class="modes">

        <div class="mode" onclick="setStudyTime(25)">
          25/5
        </div>

        <div class="mode" onclick="setStudyTime(45)">
          45/10
        </div>

        <div class="mode" onclick="setStudyTime(60)">
          60/15
        </div>

      </div>

    </div>

    <!-- MUSIC -->

    <div class="card">

      <div class="music-title">
        🎵 Nghe Nhạc Thư Giãn
      </div>

      <div class="music-sub">
        Dán link YouTube rồi bấm Phát
      </div>

      <div class="music-box">

        <input
        type="text"
        id="youtubeLink"
        placeholder="Dán link YouTube..."
        >

        <button
        class="main-btn"
        onclick="loadVideo()">
          Phát
        </button>

      </div>

      <iframe
      id="youtubePlayer"
      src="https://www.youtube.com/embed/jfKfPfyJRdk"
      allowfullscreen>
      </iframe>

    </div>

  </div>

  <div class="footer">
    ✨ MDungx Timer
  </div>

</div>

<script>

  /* QUOTES */

  const quotes = [

    "“Trí tưởng tượng quan trọng hơn kiến thức.” — Albert Einstein",

    "“Thiên tài là 1% cảm hứng và 99% chăm chỉ.” — Thomas Edison",

    "“Toán học là ngôn ngữ của vũ trụ.” — Galileo Galilei",

    "“Không có gì đáng sợ, chỉ là chưa hiểu mà thôi.” — Marie Curie",

    "“Người chưa từng mắc sai lầm là người chưa từng thử điều gì mới.” — Albert Einstein"

  ];

  let quoteIndex = 0;

  setInterval(() => {

    quoteIndex++;

    if(quoteIndex >= quotes.length){

      quoteIndex = 0;

    }

    document.getElementById("quote").innerHTML =
    quotes[quoteIndex];

  },5000);

  /* THEME */

  function toggleTheme(){

    document.body.classList.toggle("light");

    const btn =
    document.querySelector(".theme-btn");

    if(document.body.classList.contains("light")){

      btn.innerHTML = "☀";

    }else{

      btn.innerHTML = "🌙";

    }

  }

  /* COUNTDOWN */

  let countdownInterval;

  function setCountdown(){

    clearInterval(countdownInterval);

    const target =
    document.getElementById("targetDate").value;

    const targetDate =
    new Date(target).getTime();

    countdownInterval = setInterval(() => {

      const now = new Date().getTime();

      const distance = targetDate - now;

      if(distance < 0){

        document.getElementById("countdown").innerHTML =
        "🎉 Đã đến mục tiêu!";

        clearInterval(countdownInterval);

        return;
      }

      const days =
      Math.floor(distance / (1000*60*60*24));

      const hours =
      Math.floor((distance % (1000*60*60*24))
      / (1000*60*60));

      const minutes =
      Math.floor((distance % (1000*60*60))
      / (1000*60));

      const seconds =
      Math.floor((distance % (1000*60))
      / 1000);

      document.getElementById("countdown").innerHTML =
      `${days} ngày ${hours} giờ ${minutes} phút ${seconds} giây`;

    },1000);

  }

  /* TIMER */

  let studySeconds = 25 * 60;
  let defaultTime = 25 * 60;

  let studyTimer;
  let running = false;

  let soundEnabled = true;

  function updateStudyDisplay(){

    let minutes =
    Math.floor(studySeconds / 60);

    let seconds =
    studySeconds % 60;

    const timeText =

    String(minutes).padStart(2,'0')
    + ":" +
    String(seconds).padStart(2,'0');

    document.getElementById("studyTimer").innerHTML =
    timeText;

    const progress =
    (studySeconds / defaultTime) * 100;

    document.getElementById("progressBar").style.width =
    progress + "%";

    /* UPDATE MINI WINDOW */

    if(miniWindow && !miniWindow.closed){

      const mini =
      miniWindow.document.getElementById("mini");

      if(mini){

        mini.innerHTML = timeText;

      }

    }

  }

  function setStudyTime(minutes){

    pauseStudyTimer();

    studySeconds = minutes * 60;

    defaultTime = minutes * 60;

    updateStudyDisplay();

  }

  function startStudyTimer(){

    if(running) return;

    running = true;

    studyTimer = setInterval(() => {

      if(studySeconds > 0){

        studySeconds--;

        updateStudyDisplay();

      }else{

        clearInterval(studyTimer);

        running = false;

        document.title = "MDungx Timer";

        if(soundEnabled){

          playBell();

        }

        alert("🎉 Hoàn thành phiên học!");

      }

    },1000);

  }

  function pauseStudyTimer(){

    clearInterval(studyTimer);

    running = false;

  }

  function resetStudyTimer(){

    pauseStudyTimer();

    studySeconds = defaultTime;

    updateStudyDisplay();

  }

  updateStudyDisplay();

  /* CHUÔNG */

  function toggleSound(){

    soundEnabled = !soundEnabled;

    alert(

      soundEnabled
      ? "🔔 Đã bật chuông"
      : "🔕 Đã tắt chuông"

    );

  }

  function playBell(){

    const audio =
    new Audio(
      "https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
    );

    audio.play();

  }

  /* YOUTUBE */

  function loadVideo(){

    const link =
    document.getElementById("youtubeLink").value;

    let videoId = "";

    if(link.includes("watch?v=")){

      videoId =
      link.split("watch?v=")[1].split("&")[0];

    }

    else if(link.includes("youtu.be/")){

      videoId =
      link.split("youtu.be/")[1];

    }

    if(videoId){

      document.getElementById("youtubePlayer").src =
      "https://www.youtube.com/embed/" + videoId;

    }

    else{

      alert("Link YouTube không hợp lệ!");

    }

  }

  /* TAB TITLE */

  const originalTitle = "MDungx Timer";

  function updateTabTitle(){

    let minutes =
    Math.floor(studySeconds / 60);

    let seconds =
    studySeconds % 60;

    let timeText =
    String(minutes).padStart(2,'0')
    + ":" +
    String(seconds).padStart(2,'0');

    if(document.hidden && running){

      document.title =
      "⏳ " + timeText + " đang học...";

    }

    else{

      document.title = originalTitle;

    }

  }

  setInterval(() => {

    if(running){

      updateTabTitle();

    }

  },1000);

  document.addEventListener("visibilitychange", () => {

    updateTabTitle();

  });

  /* MINI WINDOW */

  let miniWindow = null;

  function openMiniTimer(){

    if(miniWindow && !miniWindow.closed){

      miniWindow.focus();
      return;

    }

    miniWindow = window.open(
      "",
      "MiniTimer",
      "width=330,height=230"
    );

    miniWindow.document.write(`

    <html>

    <head>

    <title>MDungx Mini Timer</title>

    <style>

      body{

        margin:0;
        display:flex;
        align-items:center;
        justify-content:center;

        height:100vh;

        background:
        linear-gradient(135deg,#0f172a,#1e1b4b);

        color:white;

        font-family:Poppins,sans-serif;

        overflow:hidden;

      }

      #mini{

        font-size:90px;
        font-weight:700;

      }

    </style>

    </head>

    <body>

      <div id="mini">25:00</div>

    </body>

    </html>

    `);

  }

</script>

</body>
</html>
