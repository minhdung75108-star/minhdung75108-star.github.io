<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>MDungx Timer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

:root{

  --bg:#0f172a;
  --card:#1e293b;
  --text:#ffffff;
  --sub:#94a3b8;

  --main:
  linear-gradient(135deg,#38bdf8,#8b5cf6);

  --shadow:
  0 10px 30px rgba(0,0,0,0.35);

}

body.light{

  --bg:#f4f6ff;
  --card:#ffffff;
  --text:#161616;
  --sub:#7d88a8;

  --main:
  linear-gradient(135deg,#6d5dfc,#c183ff);

  --shadow:
  0 10px 30px rgba(0,0,0,0.08);

}

body{

  background:var(--bg);
  color:var(--text);

  min-height:100vh;

  padding:30px;

  transition:0.35s;

}

.container{
  max-width:1500px;
  margin:auto;
}

/* HEADER */

.header{

  display:flex;
  justify-content:space-between;
  align-items:center;

  flex-wrap:wrap;

  gap:20px;

  margin-bottom:30px;

}

.left-header{

  display:flex;
  align-items:center;
  gap:20px;

}

.fire-box{

  width:95px;
  height:95px;

  border-radius:28px;

  background:var(--card);

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  box-shadow:var(--shadow);

  overflow:hidden;

}

.fire-box img{

  width:72px;
  z-index:2;

}

.streak{

  position:absolute;

  bottom:8px;
  right:12px;

  background:#ff9800;

  width:28px;
  height:28px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:15px;
  font-weight:700;

  color:white;

  border:2px solid white;

}

.title h1{

  font-size:50px;
  font-weight:800;

}

.title p{

  color:var(--sub);
  margin-top:5px;
  font-size:18px;

}

.theme-btn{

  width:70px;
  height:70px;

  border:none;

  border-radius:50%;

  background:var(--card);

  color:var(--text);

  font-size:28px;

  cursor:pointer;

  transition:0.25s;

  box-shadow:var(--shadow);

}

.theme-btn:hover{

  transform:
  translateY(-5px)
  scale(1.05);

}

.theme-btn:active{

  transform:
  scale(0.9);

}

/* COUNTDOWN */

.countdown-box{

  background:var(--card);

  border-radius:35px;

  padding:40px;

  box-shadow:var(--shadow);

  margin-bottom:30px;

  text-align:center;

  position:relative;

  overflow:hidden;

}

.countdown-box::before{

  content:"";

  position:absolute;

  width:400px;
  height:400px;

  border-radius:50%;

  background:
  rgba(255,255,255,0.03);

  top:-150px;
  right:-150px;

}

.quote{

  font-size:22px;

  color:var(--sub);

  margin-bottom:20px;

  line-height:1.6;

  position:relative;
  z-index:2;

}

.countdown{

  font-size:75px;
  font-weight:800;

  background:var(--main);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  margin-bottom:25px;

  position:relative;
  z-index:2;

}

.date-box{

  display:flex;
  justify-content:center;
  gap:15px;

  flex-wrap:wrap;

  position:relative;
  z-index:2;

}

input{

  padding:18px;

  border:none;

  border-radius:18px;

  background:#334155;

  color:white;

  font-size:16px;

  outline:none;

  transition:0.25s;

}

body.light input{

  background:#eef1ff;
  color:#111;

}

input:focus{

  transform:scale(1.03);

}

button{
  border:none;
  cursor:pointer;
}

/* BUTTON */

.main-btn{

  padding:18px 28px;

  border-radius:18px;

  background:var(--main);

  color:white;

  font-size:16px;
  font-weight:600;

  transition:0.25s;

}

.main-btn:hover{

  transform:
  translateY(-4px)
  scale(1.03);

}

.main-btn:active{

  transform:
  scale(0.9);

}

/* MAIN */

.main{

  display:grid;

  grid-template-columns:1.2fr 1fr;

  gap:30px;

}

.card{

  background:var(--card);

  border-radius:35px;

  padding:35px;

  box-shadow:var(--shadow);

  position:relative;

  overflow:hidden;

}

.card::before{

  content:"";

  position:absolute;

  width:250px;
  height:250px;

  background:
  rgba(255,255,255,0.03);

  border-radius:50%;

  top:-100px;
  right:-100px;

}

.top-line{

  display:flex;
  justify-content:space-between;
  align-items:center;

  flex-wrap:wrap;

  gap:10px;

  margin-bottom:25px;

  position:relative;
  z-index:2;

}

.top-line h2{

  font-size:36px;

}

.top-line span{

  color:var(--sub);

}

/* TIMER */

.study-time{

  text-align:center;

  font-size:120px;
  font-weight:800;

  background:var(--main);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  margin:25px 0;

  position:relative;
  z-index:2;

}

.progress{

  width:100%;
  height:18px;

  background:#334155;

  border-radius:20px;

  overflow:hidden;

  margin-bottom:30px;

  position:relative;
  z-index:2;

}

body.light .progress{

  background:#e7ebff;

}

.progress-bar{

  width:100%;
  height:100%;

  background:var(--main);

  border-radius:20px;

  transition:1s linear;

}

.controls{

  display:flex;
  justify-content:center;

  flex-wrap:wrap;

  gap:15px;

  margin-bottom:25px;

  position:relative;
  z-index:2;

}

.control-btn{

  padding:16px 26px;

  border-radius:18px;

  background:#334155;

  color:white;

  font-size:16px;
  font-weight:600;

  transition:0.25s;

}

body.light .control-btn{

  background:#eef1ff;
  color:#111;

}

.control-btn:hover{

  transform:
  translateY(-4px)
  scale(1.03);

}

.control-btn:active{

  transform:
  scale(0.9);

}

.active-btn{

  background:var(--main);

}

/* CUSTOM */

.custom-box{

  display:flex;
  justify-content:center;
  gap:15px;

  flex-wrap:wrap;

  margin-bottom:25px;

  position:relative;
  z-index:2;

}

.small-input{

  width:140px;

}

.modes{

  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:15px;

  position:relative;
  z-index:2;

}

.mode{

  padding:14px 20px;

  border-radius:18px;

  background:#334155;

  cursor:pointer;

  transition:0.25s;

}

body.light .mode{

  background:#eef1ff;
  color:#111;

}

.mode:hover{

  transform:
  translateY(-4px)
  scale(1.03);

  background:
  linear-gradient(135deg,#38bdf8,#8b5cf6);

}

/* MUSIC */

.music-title{

  font-size:36px;
  margin-bottom:10px;

  position:relative;
  z-index:2;

}

.music-sub{

  color:#38bdf8;
  font-weight:600;

  margin-bottom:20px;

  position:relative;
  z-index:2;

}

.music-box{

  display:flex;
  gap:15px;

  flex-wrap:wrap;

  margin-bottom:20px;

  position:relative;
  z-index:2;

}

.music-box input{

  flex:1;

}

iframe{

  width:100%;
  height:340px;

  border:none;

  border-radius:25px;

  position:relative;
  z-index:2;

}

/* HISTORY */

.history{

  margin-top:25px;

  position:relative;
  z-index:2;

}

.history h3{

  margin-bottom:15px;
  font-size:24px;

}

.history-list{

  display:flex;
  flex-direction:column;
  gap:12px;

  max-height:250px;
  overflow:auto;

}

.history-item{

  background:#334155;

  padding:15px;

  border-radius:16px;

  display:flex;
  justify-content:space-between;

}

body.light .history-item{

  background:#eef1ff;

}

.footer{

  text-align:center;

  margin-top:30px;

  color:var(--sub);

}

@media(max-width:1000px){

  .main{
    grid-template-columns:1fr;
  }

  .study-time{
    font-size:70px;
  }

  .countdown{
    font-size:42px;
  }

  .title h1{
    font-size:35px;
  }

}

</style>
</head>
<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div class="left-header">

      <div class="fire-box">

        <img src="https://cdn-icons-png.flaticon.com/512/785/785116.png">

        <div class="streak" id="streak">
          1
        </div>

      </div>

      <div class="title">

        <h1>MDungx Timer</h1>

        <p>
          Học tập hiệu quả — tập trung tối đa.
        </p>

      </div>

    </div>

    <button class="theme-btn" onclick="toggleTheme()">
      🌙
    </button>

  </div>

  <!-- COUNTDOWN -->

  <div class="countdown-box">

    <div class="quote" id="quote">

      “Trí tưởng tượng quan trọng hơn kiến thức.” — Albert Einstein

    </div>

    <div class="countdown" id="countdown">

      00 ngày 00 giờ 00 phút 00 giây

    </div>

    <div class="date-box">

      <input type="datetime-local" id="targetDate">

      <button class="main-btn" onclick="setCountdown()">
        Đặt thời gian
      </button>

    </div>

  </div>

  <!-- MAIN -->

  <div class="main">

    <!-- TIMER -->

    <div class="card">

      <div class="top-line">

        <h2 id="statusText">
          ✔ Làm việc
        </h2>

        <span>
          MDungx Pomodoro
        </span>

      </div>

      <div class="study-time" id="studyTimer">
        25:00
      </div>

      <div class="progress">

        <div class="progress-bar" id="progressBar"></div>

      </div>

      <div class="controls">

        <button
        class="control-btn active-btn"
        onclick="startStudyTimer()">
          ▶ Bắt đầu
        </button>

        <button
        class="control-btn"
        onclick="pauseStudyTimer()">
          ⏸ Tạm dừng
        </button>

        <button
        class="control-btn"
        onclick="resetStudyTimer()">
          ↻ Reset
        </button>

        <button
        class="control-btn"
        onclick="toggleSound()">
          🔔 Chuông
        </button>

      </div>

      <!-- CUSTOM -->

      <div class="custom-box">

        <input
        type="number"
        id="studyInput"
        class="small-input"
        placeholder="Phút học">

        <input
        type="number"
        id="breakInput"
        class="small-input"
        placeholder="Phút nghỉ">

        <button
        class="main-btn"
        onclick="applyCustomTime()">
          Áp dụng
        </button>

      </div>

      <!-- MODES -->

      <div class="modes">

        <div
        class="mode"
        onclick="setStudyTime(25,5)">
          25 / 5
        </div>

        <div
        class="mode"
        onclick="setStudyTime(45,10)">
          45 / 10
        </div>

        <div
        class="mode"
        onclick="setStudyTime(60,15)">
          60 / 15
        </div>

      </div>

      <!-- HISTORY -->

      <div class="history">

        <h3>
          📚 Lịch sử học hôm nay
        </h3>

        <div class="history-list" id="historyList">

        </div>

      </div>

    </div>

    <!-- MUSIC -->

    <div class="card">

      <div class="music-title">
        🎵 Nghe Nhạc Thư Giãn
      </div>

      <div class="music-sub">
        Dán link YouTube rồi bấm Phát
      </div>

      <div class="music-box">

        <input
        type="text"
        id="youtubeLink"
        placeholder="Dán link YouTube...">

        <button
        class="main-btn"
        onclick="loadVideo()">
          Phát
        </button>

      </div>

      <iframe
      id="youtubePlayer"
      src="https://www.youtube.com/embed/jfKfPfyJRdk"
      allowfullscreen>
      </iframe>

    </div>

  </div>

  <div class="footer">
    ✨ MDungx Timer
  </div>

</div>

<script>

/* QUOTES */

const quotes = [

  "“Trí tưởng tượng quan trọng hơn kiến thức.” — Albert Einstein",

  "“Thiên tài là 1% cảm hứng và 99% chăm chỉ.” — Thomas Edison",

  "“Toán học là ngôn ngữ của vũ trụ.” — Galileo Galilei",

  "“Không có gì đáng sợ, chỉ là chưa hiểu mà thôi.” — Marie Curie",

  "“Người chưa từng mắc sai lầm là người chưa từng thử điều gì mới.” — Albert Einstein"

];

let quoteIndex = 0;

setInterval(()=>{

  quoteIndex++;

  if(quoteIndex >= quotes.length){

    quoteIndex = 0;

  }

  document.getElementById("quote").innerHTML =
  quotes[quoteIndex];

},5000);

/* THEME */

function toggleTheme(){

  document.body.classList.toggle("light");

  const btn =
  document.querySelector(".theme-btn");

  if(document.body.classList.contains("light")){

    btn.innerHTML = "☀";

  }

  else{

    btn.innerHTML = "🌙";

  }

}

/* STREAK */

let streak =
parseInt(localStorage.getItem("streak")) || 0;

let lastVisit =
localStorage.getItem("lastVisit");

const today =
new Date().toDateString();

if(lastVisit !== today){

  streak++;

  localStorage.setItem("streak", streak);

  localStorage.setItem("lastVisit", today);

}

document.getElementById("streak").innerHTML =
streak;

/* COUNTDOWN */

let countdownInterval;

function setCountdown(){

  clearInterval(countdownInterval);

  const target =
  document.getElementById("targetDate").value;

  const targetDate =
  new Date(target).getTime();

  countdownInterval = setInterval(()=>{

    const now = new Date().getTime();

    const distance = targetDate - now;

    if(distance < 0){

      document.getElementById("countdown").innerHTML =
      "🎉 Đã đến mục tiêu!";

      clearInterval(countdownInterval);

      return;

    }

    const days =
    Math.floor(distance / (1000*60*60*24));

    const hours =
    Math.floor((distance % (1000*60*60*24))
    / (1000*60*60));

    const minutes =
    Math.floor((distance % (1000*60*60))
    / (1000*60));

    const seconds =
    Math.floor((distance % (1000*60))
    / 1000);

    document.getElementById("countdown").innerHTML =

    `${days} ngày ${hours} giờ ${minutes} phút ${seconds} giây`;

  },1000);

}

/* TIMER */

let studySeconds = 25 * 60;
let defaultStudy = 25 * 60;

let breakSeconds = 5 * 60;
let defaultBreak = 5 * 60;

let isBreak = false;

let studyTimer;

let running = false;

let soundEnabled = true;

/* UPDATE */

function updateStudyDisplay(){

  let currentTime =
  isBreak ? breakSeconds : studySeconds;

  let minutes =
  Math.floor(currentTime / 60);

  let seconds =
  currentTime % 60;

  const timeText =

  String(minutes).padStart(2,'0')
  + ":" +
  String(seconds).padStart(2,'0');

  document.getElementById("studyTimer").innerHTML =
  timeText;

  document.title =
  running
  ? "⏳ " + timeText + " | MDungx Timer"
  : "MDungx Timer";

  const status =
  document.getElementById("statusText");

  if(isBreak){

    status.innerHTML = "☕ Nghỉ ngơi";

  }

  else{

    status.innerHTML = "✔ Làm việc";

  }

  let progress;

  if(isBreak){

    progress =
    (breakSeconds / defaultBreak) * 100;

  }

  else{

    progress =
    (studySeconds / defaultStudy) * 100;

  }

  document.getElementById("progressBar").style.width =
  progress + "%";

}

/* SET TIME */

function setStudyTime(study,rest){

  pauseStudyTimer();

  studySeconds = study * 60;
  defaultStudy = study * 60;

  breakSeconds = rest * 60;
  defaultBreak = rest * 60;

  isBreak = false;

  updateStudyDisplay();

}

/* CUSTOM */

function applyCustomTime(){

  const study =
  parseInt(document.getElementById("studyInput").value);

  const rest =
  parseInt(document.getElementById("breakInput").value);

  if(!study || !rest){

    alert("Nhập thời gian hợp lệ!");

    return;

  }

  setStudyTime(study,rest);

}

/* START */

function startStudyTimer(){

  if(running) return;

  running = true;

  studyTimer = setInterval(()=>{

    if(!isBreak){

      if(studySeconds > 0){

        studySeconds--;

      }

      else{

        isBreak = true;

        if(soundEnabled){

          playBell();

        }

        saveHistory();

        alert("☕ Đến giờ nghỉ!");

      }

    }

    else{

      if(breakSeconds > 0){

        breakSeconds--;

      }

      else{

        clearInterval(studyTimer);

        running = false;

        isBreak = false;

        studySeconds = defaultStudy;
        breakSeconds = defaultBreak;

        if(soundEnabled){

          playBell();

        }

        alert("🔥 Nghỉ xong rồi!");

      }

    }

    updateStudyDisplay();

  },1000);

}

/* PAUSE */

function pauseStudyTimer(){

  clearInterval(studyTimer);

  running = false;

}

/* RESET */

function resetStudyTimer(){

  pauseStudyTimer();

  isBreak = false;

  studySeconds = defaultStudy;
  breakSeconds = defaultBreak;

  updateStudyDisplay();

}

/* SOUND */

function toggleSound(){

  soundEnabled = !soundEnabled;

  alert(

    soundEnabled
    ? "🔔 Đã bật chuông"
    : "🔕 Đã tắt chuông"

  );

}

function playBell(){

  const audio =
  new Audio(
    "https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
  );

  audio.play();

}

/* YOUTUBE */

function loadVideo(){

  const link =
  document.getElementById("youtubeLink").value;

  let videoId = "";

  if(link.includes("watch?v=")){

    videoId =
    link.split("watch?v=")[1].split("&")[0];

  }

  else if(link.includes("youtu.be/")){

    videoId =
    link.split("youtu.be/")[1];

  }

  if(videoId){

    document.getElementById("youtubePlayer").src =
    "https://www.youtube.com/embed/" + videoId;

  }

  else{

    alert("Link không hợp lệ!");

  }

}

/* HISTORY */

function saveHistory(){

  const today =
  new Date().toLocaleDateString();

  let history =
  JSON.parse(localStorage.getItem("studyHistory")) || [];

  history.unshift({

    date: today,

    time:
    `${defaultStudy/60} phút học`

  });

  localStorage.setItem(
    "studyHistory",
    JSON.stringify(history)
  );

  loadHistory();

}

function loadHistory(){

  const list =
  document.getElementById("historyList");

  list.innerHTML = "";

  let history =
  JSON.parse(localStorage.getItem("studyHistory")) || [];

  history.forEach(item=>{

    list.innerHTML += `

    <div class="history-item">

      <span>${item.date}</span>

      <span>${item.time}</span>

    </div>

    `;

  });

}

loadHistory();

setStudyTime(25,5);

</script>

</body>
</html>
